
{% extends "base.html" %}
{% from "_m.html" import fields as F %}

{% block c %}
<div class="shared-form-page">

    <div class="shared-form-card">

        <div class="shared-form-heading">
            <span class="form-label">HOTEL AGAPASTALA</span>
            <h2>{{ title }}</h2>
        </div>

        <form method="post" class="shared-form">
            {{ F(fields) }}

            <div class="shared-form-submit">
                <button type="submit">{{ submit }}</button>
            </div>
        </form>

        {% if extra %}
            <div class="shared-form-extra">
                {{ extra|safe }}
            </div>
        {% endif %}

    </div>

</div>
{% endblock %}
